name: release

# A pushed tag releases that tag. Run by hand with a tag name, the workflow
# releases the commit it runs on and creates the tag itself.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, for example v0.9.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-check
      - run: make web
      - run: make check
      - run: scripts/build-release.sh "${TAG}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" dist/*.tar.gz dist/checksums.txt --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
